name: Build manuscript

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript.tex
          working_directory: manuscript
          latexmk_use_xelatex: false
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: manuscript/manuscript.pdf

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run arithmetic checks
        run: python -m unittest scripts.test_scaling
      - name: Smoke-check the CLI entry point
        run: python scripts/check_scaling.py --n 1000

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake build output
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake/build
            lean/.lake/packages
          key: lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - name: Fetch mathlib cache
        working-directory: lean
        run: |
          lake update
          lake exe cache get || true
      - name: Build Lean project
        working-directory: lean
        run: lake build
